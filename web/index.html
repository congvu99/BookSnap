/* Critical boot loader: shown until Preact renders into #app. Mirrors .vinyl-loader in css/loading.css. */
html,body{margin:0;background:var(--bg,#FBF7EF)}
.vinyl-loader{--vl-size:112px;--vl-hole:var(--bg,#FBF7EF);--vl-ink:var(--ink-muted,#5E554A);--vl-primary:var(--primary,#7A2E2E);--vl-gold:var(--gold,#B08D57);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;min-height:100vh;min-height:100dvh;box-sizing:border-box;padding:24px}
@media (prefers-color-scheme:dark){html:not([data-theme=light]),html:not([data-theme=light]) body{background:#1C1915}.vinyl-loader{--vl-hole:var(--bg,#1C1915);--vl-ink:var(--ink-muted,#B3A996);--vl-primary:var(--primary,#D98C7F);--vl-gold:var(--gold,#C9A66B)}}
.vinyl-loader-stage{position:relative;flex:none;width:calc(var(--vl-size)*1.28);height:var(--vl-size)}
.vinyl-loader-record{position:absolute;left:0;top:0;width:var(--vl-size);height:var(--vl-size);border-radius:50%;background:radial-gradient(circle,var(--vl-hole) 0 3%,transparent 3.5%),radial-gradient(circle,var(--vl-primary) 0 21%,var(--vl-gold) 21.5% 24%,transparent 24.5%),repeating-radial-gradient(circle,rgba(255,255,255,.09) 0 1px,transparent 1px 3px),conic-gradient(from 20deg,transparent 0 30%,rgba(255,255,255,.1) 38%,transparent 46% 80%,rgba(255,255,255,.08) 88%,transparent 96%),#111;box-shadow:0 0 0 1px #3A3A3A,0 6px 16px rgba(0,0,0,.22);animation:vinyl-loader-spin 3.6s linear infinite}
.vinyl-loader-arm{position:absolute;right:calc(var(--vl-size)*.06);top:calc(var(--vl-size)*.04);width:calc(var(--vl-size)*.07);height:calc(var(--vl-size)*.72);border-radius:99px;background:linear-gradient(90deg,#8D6831,#EBD29A 45%,#C29A58);transform-origin:50% calc(var(--vl-size)*.035);transform:rotate(-9deg)}
.vinyl-loader-arm::before{content:'';position:absolute;left:50%;top:calc(var(--vl-size)*-.04);width:calc(var(--vl-size)*.17);height:calc(var(--vl-size)*.17);margin-left:calc(var(--vl-size)*-.085);border-radius:50%;background:radial-gradient(circle at 35% 30%,#EBD29A,#C29A58 55%,#8D6831)}
.vinyl-loader-arm::after{content:'';position:absolute;left:50%;bottom:calc(var(--vl-size)*-.05);width:calc(var(--vl-size)*.12);height:calc(var(--vl-size)*.12);margin-left:calc(var(--vl-size)*-.04);border-radius:2px;background:#8D6831}
.vinyl-loader-label{font:700 18px/1.2 'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.02em;color:var(--vl-ink)}
@keyframes vinyl-loader-spin{to{transform:rotate(360deg)}}
</style>
